name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} (syntax, unit tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the theme and plugin promise to run on, and the one used in development.
        php: ['8.1', '8.3']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check the syntax of every PHP file
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <(git ls-files -z '*.php')
          exit "$status"

      - name: Install test tools
        run: composer install --no-interaction --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit -c tests/php/phpunit.xml

      - name: Audit PHP dependencies
        run: composer audit

  shop:
    name: Shop on PHP ${{ matrix.php }} (WordPress, browser tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The theme only ever runs inside WordPress, so the oldest PHP version it
        # promises to support is tested here too – the unit tests cover the plugin alone.
        php: ['8.1', '8.3']

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      STIQON_DB_ADMIN_PASSWORD: root

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd, intl, zip, mbstring, curl, dom, exif
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Build the theme
        run: npm run build

      # Builds a fresh WordPress site (tests/e2e/server.sh) and tests it in the browser.
      - name: Run browser tests
        run: npm run e2e

      # The setup script promises that a second run keeps the site and repairs it.
      - name: Run the setup a second time
        run: bash tools/dev/setup-wordpress.sh --site e2e --port 8123

      - name: Check the installation and its error log
        run: bash tests/integration/run.sh

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p test-results/logs
          cp "$HOME"/.stiqon-wp/sites/e2e.server.log test-results/logs/ 2>/dev/null || true
          cp "$HOME"/.stiqon-wp/sites/e2e/wp-content/debug.log test-results/logs/ 2>/dev/null || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shop-results-php${{ matrix.php }}
          path: test-results
          retention-days: 7
